<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pet Shop</title>
</head>
<body>

<nav>
<a href="#home">Home</a> |
<a href="#pets">Pets</a> |
<a href="#contact">Contact</a> |
<a href="#video">Video</a>
</nav>

<header id="home">
<h1>Welcome to The Pet Shop!</h1>
<p>Find a lovely animal companion for your family.</p>
</header>

<section id="pets">
<h2>Our Pets</h2>

<h3>Cats and Kittens</h3>
<img src="../Images/picture.jpg" alt="Picture of cats">

<h3>Dogs and Puppies</h3>
<img src="../Images/dog.png" alt="Picture of a dog">

<h3>Rabbits</h3>
<img src="../Images/rabbit.jpg" alt="Picture of a rabbit">
</section>

<section id="contact">
<h2>Contact Us</h2>
<form>
<label for="name">Your name:</label>
<input type="text" id="name" name="name">
<br><br>

<label for="email">Your email:</label>
<input type="email" id="email" name="email">
<br><br>

<label for="message">Your message:</label>
<textarea id="message" name="message"></textarea>
<br><br>

<button type="submit">Send Message</button>
</form>
</section>

<section id="video">
<h2>Pet Video</h2>
<iframe
width="560"
height="315"
src="https://www.youtube.com/embed/aqz-KE-bpKQ"
title="Video"
allowfullscreen>
</iframe>
</section>

<footer>
<p>&copy; 2026 The Pet Shop</p>
</footer>

</body>
</html>
