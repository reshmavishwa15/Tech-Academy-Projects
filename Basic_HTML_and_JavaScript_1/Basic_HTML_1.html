

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Assignment</title>
</head>
<body>
<p><font face="Arial" size="2">This text uses Arial font in size 2.</font></p>
<p><font face="Verdana" size="4">This text uses Verdana font in size 4.</font></p>
<p><font face="Georgia" size="6">This text uses Georgia font in size 6.</font></p>

<p><font color="blue">This text is blue using a color name.</font></p>
<p><font color="#FF0000">This text is red using a hex code.</font></p>

<p><b> This text is bold.</b></p>
<p><i>This text is italic.</i></p>
<p><u>This text is underlined.</u></p>
<img src="dog.jpg.webp" alt="A picture a dog">
</body>
</html>
